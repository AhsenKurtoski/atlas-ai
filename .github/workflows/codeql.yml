name: CodeQL

# Analisi statica di sicurezza (SAST) di GitHub. Non sostituisce i test: cerca
# pattern pericolosi (injection, path traversal, gestione dei segreti) che una
# suite di test non vede. I risultati compaiono in Security → Code scanning.
#
# Il repository è pubblico, quindi CodeQL è gratuito. La schedulazione
# settimanale serve perché nuove query vengono aggiunte anche senza modifiche
# al codice.

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analisi ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v7

      - name: Inizializza CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Analizza
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
