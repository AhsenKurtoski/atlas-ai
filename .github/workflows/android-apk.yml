name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      EXPO_PUBLIC_API_URL: "https://atlas-ai.tailf30c71.ts.net"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa dipendenze
        run: npm ci

      - name: Genera il progetto Android
        run: npx expo prebuild --platform android --no-install

      - name: Aumenta la memoria di Gradle
        run: echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Diagnostica risoluzione React Native (stessa chiamata di Expo)
        working-directory: frontend/android
        run: |
          set +e
          echo "node: $(command -v node) $(node -v)"
          ls -l ../node_modules/react-native/package.json
          OUT=$(node --print "require.resolve('react-native/package.json')" 2>&1)
          STATUS=$?
          echo "uscita node ($STATUS): $OUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::node non risolve react-native/package.json (exit $STATUS): $(echo "$OUT" | tr '\n' ' ' | cut -c1-1500)"
            exit "$STATUS"
          fi

      - name: Bundle JS Android (diagnostica)
        run: |
          set +e
          npx expo export:embed --platform android --dev false \
            --bundle-output /tmp/atlas-android.bundle \
            --assets-dest /tmp/atlas-android-assets > /tmp/atlas-embed.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Bundle JS Android fallito ($STATUS): $(tail -25 /tmp/atlas-embed.log | tr '\n' ' ' | cut -c1-1800)"
            exit "$STATUS"
          fi

      - name: Compila APK
        working-directory: frontend/android
        env:
          # Il bundle release di RN 0.86 supera l'heap Node predefinito sui
          # runner da 7 GB: senza questo il task Gradle esce con "command node
          # finished with non-zero exit value 1" senza altro dettaglio.
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          set -o pipefail
          set +e
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/atlas-gradle.log
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            # Il messaggio utile sta nelle righe immediatamente successive a
            # "What went wrong" e prima di "Try".
            SUMMARY=$(awk '/What went wrong/{flag=1} flag{print} /^\* Try:/{flag=0}' /tmp/atlas-gradle.log | head -25 | tr '\n' ' ' | cut -c1-1800)
            if [ -z "$SUMMARY" ]; then
              SUMMARY=$(tail -30 /tmp/atlas-gradle.log | tr '\n' ' ' | cut -c1-1800)
            fi
            # Contesto: le righe prima dell'errore contengono l'output di Node/Metro.
            CONTEXT=$(grep -B 30 "What went wrong" /tmp/atlas-gradle.log | tr '\n' ' ' | cut -c1-900)
            STACK=$(grep -A 80 "What went wrong" /tmp/atlas-gradle.log | head -100 | tr '\n' ' ' | cut -c1-2200)
            SUMMARY="$SUMMARY || CONTESTO: $CONTEXT || STACK: $STACK"
            echo "::error::Gradle fallito (exit $STATUS): $SUMMARY"
            exit "$STATUS"
          fi

      - name: Carica log Gradle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-AI-gradle-log
          path: /tmp/atlas-gradle.log
          if-no-files-found: warn

      - name: Prepara l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ATLAS-AI-android.apk

      - name: Carica artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-AI-android
          path: frontend/ATLAS-AI-android.apk
          if-no-files-found: error

  install-smoke:
    name: Install and launch on Android emulator
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Scarica APK
        uses: actions/download-artifact@v4
        with:
          name: ATLAS-AI-android
          path: .

      - name: Abilita KVM per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Installa e avvia l'APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash frontend/scripts/android-smoke.sh

      - name: Carica screenshot installazione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-AI-android-install
          path: |
            atlas-install.png
            atlas-window.xml
            android-logcat.txt
            android-package.txt
          if-no-files-found: warn

  publish-release:
    name: Publish APK release
    needs: install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica APK testato
        uses: actions/download-artifact@v4
        with:
          name: ATLAS-AI-android
          path: frontend

      - name: Pubblica release scaricabile
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v3.3.0
          name: ATLAS AI Android v3.3.0 (Tailscale Funnel)
          files: frontend/ATLAS-AI-android.apk
          overwrite: true
          prerelease: true
          generate_release_notes: true
