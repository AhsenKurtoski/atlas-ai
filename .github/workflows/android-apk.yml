name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

# Due push ravvicinati non devono pubblicare lo stesso tag in parallelo.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      EXPO_PUBLIC_API_URL: "https://atlas-ai.tailf30c71.ts.net"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa dipendenze
        run: npm ci

      - name: Genera il progetto Android
        run: npx expo prebuild --platform android --no-install

      - name: Aumenta la memoria di Gradle
        run: |
          # Il file generato da SDK 57 non termina con newline: un semplice
          # `echo >>` concatenerebbe la riga all'ultima proprietà (e ai comandi
          # node lanciati da Gradle, che fallivano con exit 1).
          printf '\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m\n' >> android/gradle.properties
          tail -2 android/gradle.properties

      - name: Compila APK
        working-directory: frontend/android
        run: |
          set -o pipefail
          set +e
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/atlas-gradle.log
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            # Il messaggio utile sta nelle righe immediatamente successive a
            # "What went wrong" e prima di "Try".
            SUMMARY=$(awk '/What went wrong/{flag=1} flag{print} /^\* Try:/{flag=0}' /tmp/atlas-gradle.log | head -25 | tr '\n' ' ' | cut -c1-1800)
            if [ -z "$SUMMARY" ]; then
              SUMMARY=$(tail -30 /tmp/atlas-gradle.log | tr '\n' ' ' | cut -c1-1800)
            fi
            # Contesto: le righe prima dell'errore contengono l'output di Node/Metro.
            CONTEXT=$(grep -B 12 "What went wrong" /tmp/atlas-gradle.log | tail -14 | tr '\n' ' ' | cut -c1-1500)
            SUMMARY="$SUMMARY || CONTESTO: $CONTEXT"
            echo "::error::Gradle fallito (exit $STATUS): $SUMMARY"
            exit "$STATUS"
          fi

      - name: Carica log Gradle (solo in caso di errore)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ATLAS-AI-gradle-log
          path: /tmp/atlas-gradle.log
          if-no-files-found: warn

      - name: Prepara l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ATLAS-AI-android.apk

      - name: Carica artifact
        uses: actions/upload-artifact@v7
        with:
          name: ATLAS-AI-android
          path: frontend/ATLAS-AI-android.apk
          if-no-files-found: error

  install-smoke:
    name: Install and launch on Android emulator
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Scarica APK
        uses: actions/download-artifact@v8
        with:
          name: ATLAS-AI-android
          path: .

      - name: Abilita KVM per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Installa e avvia l'APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash frontend/scripts/android-smoke.sh

      - name: Carica screenshot installazione
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ATLAS-AI-android-install
          path: |
            atlas-install.png
            atlas-window.xml
            android-logcat.txt
            android-package.txt
          if-no-files-found: warn

  publish-release:
    name: Publish APK release
    needs: install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Leggi la versione da frontend/package.json
        id: version
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          test -n "$VERSION"
          echo "Versione app: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Scarica APK testato
        uses: actions/download-artifact@v8
        with:
          name: ATLAS-AI-android
          path: frontend

      - name: Pubblica release scaricabile
        uses: softprops/action-gh-release@v3
        with:
          # Tag e titolo seguono la versione dell'app: senza bump il rilascio
          # viene aggiornato (overwrite) invece di duplicato.
          tag_name: android-v${{ steps.version.outputs.version }}
          name: ATLAS AI Android v${{ steps.version.outputs.version }} (Tailscale Funnel)
          files: frontend/ATLAS-AI-android.apk
          overwrite_files: true
          # Esplicito: aggiornando una release già esistente il flag va azzerato,
          # altrimenti resterebbe marcata come prerelease.
          prerelease: false
          generate_release_notes: true
