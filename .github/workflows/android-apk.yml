name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      EXPO_PUBLIC_API_URL: "https://atlas-ai.tailf30c71.ts.net"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa dipendenze
        run: npm ci

      - name: Genera il progetto Android
        run: npx expo prebuild --platform android --no-install

      - name: Aumenta la memoria di Gradle
        run: echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Compila APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepara l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ATLAS-AI-android.apk

      - name: Carica artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-AI-android
          path: frontend/ATLAS-AI-android.apk
          if-no-files-found: error

  install-smoke:
    name: Install and launch on Android emulator
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Scarica APK
        uses: actions/download-artifact@v4
        with:
          name: ATLAS-AI-android
          path: .

      - name: Abilita KVM per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Installa e avvia l'APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -uo pipefail
            adb wait-for-device
            for attempt in $(seq 1 60); do
              BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$BOOTED" = "1" ]; then
                echo "Emulatore avviato dopo $((attempt * 2))s"
                break
              fi
              sleep 2
            done
            adb logcat -c
            adb shell input keyevent 82 || true
            echo "APK: $(ls -lh ATLAS-AI-android.apk)"
            adb devices
            adb shell getprop ro.product.cpu.abi || true
            adb shell getprop ro.build.version.sdk || true
            adb shell df -h /data || true
            INSTALL_STATUS=0
            for attempt in 1 2 3; do
              adb install -r ATLAS-AI-android.apk > /tmp/atlas-install.log 2>&1 && {
                INSTALL_STATUS=0
                break
              }
              INSTALL_STATUS=$?
              echo "Tentativo installazione $attempt fallito (exit $INSTALL_STATUS)"
              cat /tmp/atlas-install.log
              sleep 5
            done
            cat /tmp/atlas-install.log
            if [ "$INSTALL_STATUS" -ne 0 ]; then
              echo "::error::adb install fallito (exit $INSTALL_STATUS): $(tail -c 1200 /tmp/atlas-install.log | tr '\n' ' ')"
              adb logcat -d -v brief > android-logcat.txt || true
              adb shell dumpsys package com.atlasai.family > android-package.txt 2>&1 || true
              adb exec-out screencap -p > atlas-install.png || true
              exit 1
            fi
            adb shell am force-stop com.atlasai.family
            adb shell am start -W -n com.atlasai.family/.MainActivity || true
            sleep 15
            PID=$(adb shell pidof com.atlasai.family | tr -d '\r')
            echo "Processo ATLAS: '$PID'"
            adb logcat -d -v brief > android-logcat.txt || true
            if [ -z "$PID" ]; then
              tail -120 android-logcat.txt
              echo "::error::Il processo ATLAS non è attivo dopo il lancio"
              adb shell dumpsys package com.atlasai.family > android-package.txt 2>&1 || true
              adb exec-out screencap -p > atlas-install.png || true
              exit 1
            fi
            adb shell uiautomator dump /sdcard/atlas-window.xml || true
            adb pull /sdcard/atlas-window.xml atlas-window.xml || true
            if [ -s atlas-window.xml ] && ! grep -Eq 'ATLAS AI|Chi sei|Inserisci PIN' atlas-window.xml; then
              tail -120 android-logcat.txt
              echo '::error::La UI ATLAS non è comparsa nel dump uiautomator'
              adb exec-out screencap -p > atlas-install.png || true
              exit 1
            fi
            if adb logcat -d -v brief | grep -q 'FATAL EXCEPTION'; then
              echo '::error::Crash Android rilevato nel logcat'
              adb logcat -d -v brief | grep -A 20 'FATAL EXCEPTION' || true
              adb exec-out screencap -p > atlas-install.png || true
              exit 1
            fi
            echo "::notice::APK installato e avviato, processo $PID"
            adb exec-out screencap -p > atlas-install.png

      - name: Carica screenshot installazione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-AI-android-install
          path: |
            atlas-install.png
            atlas-window.xml
            android-logcat.txt
            android-package.txt
          if-no-files-found: warn

  publish-release:
    name: Publish APK release
    needs: install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica APK testato
        uses: actions/download-artifact@v4
        with:
          name: ATLAS-AI-android
          path: frontend

      - name: Pubblica release scaricabile
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v3.2.0
          name: ATLAS AI Android v3.2.0 (Tailscale Funnel)
          files: frontend/ATLAS-AI-android.apk
          prerelease: true
          generate_release_notes: true
