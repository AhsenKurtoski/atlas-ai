name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Controlla le dipendenze
        run: python -m pip check
      - name: Installa Chromium per l'agente browser
        run: python -m playwright install --with-deps chromium
      - name: Test
        run: pytest -q
        env:
          APP_ENV: test

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa dipendenze
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build web (export statico)
        run: npm run export:web

  security:
    name: Sicurezza (dipendenze e segreti)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks legge tutta la storia: con il checkout shallow non vedrebbe
          # un segreto committato mesi fa e rimosso dopo.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa pip-audit
        run: pip install -q pip-audit

      - name: Vulnerabilità delle dipendenze Python
        # Legge requirements.txt senza installare il progetto: 0 vulnerabilità
        # note oggi, quindi il controllo può bloccare la CI.
        run: pip-audit -r backend/requirements.txt --progress-spinner off

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Vulnerabilità delle dipendenze frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: gitleaks — nessun segreto nella storia
        shell: bash
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            version=8.24.3
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
              | tar -xz -C /usr/local/bin gitleaks
          fi
          gitleaks detect --source . --redact --no-banner --exit-code 1
