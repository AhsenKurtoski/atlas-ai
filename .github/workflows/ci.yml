name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  # Ogni lunedì alle 06:00 UTC. Serve a scoprire una CVE pubblicata dopo
  # l'ultimo push: i backend e il frontend non vengono rieseguiti (sarebbero
  # identici), gira solo il job di sicurezza.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Una nuova push sullo stesso branch/PR annulla la run precedente: inutile
# tenere in coda una build già superata. Sul branch principale e sulle run
# schedulate non si annulla nulla.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (pytest, Python ${{ matrix.python-version }})
    # Con il cron settimanale gira solo `security`: le versioni di Python non
    # cambiano da sole e rifare 3 build ogni lunedì sarebbe solo rumore.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Le versioni dichiarate in README/requirements sono 3.11–3.13: qui si
        # verificano gli estremi, non solo la 3.12 usata in sviluppo.
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Controlla le dipendenze
        run: python -m pip check
      - name: Installa Chromium per l'agente browser
        run: python -m playwright install --with-deps chromium
      - name: Test
        run: pytest -q
        env:
          APP_ENV: test

  frontend:
    name: Frontend (TypeScript)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa dipendenze
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build web (export statico)
        run: npm run export:web

  security:
    name: Sicurezza (dipendenze e segreti)
    # Sempre: è il job che deve restare verde anche quando non c'è nessun push
    # (run schedulata) e che deve poter essere rilanciato a mano.
    uses: ./.github/workflows/security.yml
