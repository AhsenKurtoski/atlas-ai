name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build-ios-simulator:
    name: Build iOS simulator app
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      EXPO_PUBLIC_API_URL: "https://atlas-ai.tailf30c71.ts.net"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Seleziona l'ultima Xcode disponibile sul runner
        run: |
          # Expo SDK 57 richiede l'SDK iOS recente: usiamo la Xcode più nuova
          # dell'immagine runner invece di fissare una versione che invecchia.
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Uso $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Verifica o installa il runtime iOS del simulatore
        run: |
          # Il runtime deve corrispondere all'SDK dell'Xcode selezionato: un
          # "iOS qualsiasi" non basta, altrimenti xcodebuild non trova la
          # destination e la build fallisce.
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "SDK simulatore richiesto: iOS $SDK_VERSION"
          if xcrun simctl list runtimes | grep -q "iOS $SDK_VERSION"; then
            echo "Runtime iOS $SDK_VERSION già disponibile:"
            xcrun simctl list runtimes | grep "iOS $SDK_VERSION"
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo xcodebuild -downloadPlatform iOS -buildVersion "$SDK_VERSION" \
              || sudo xcodebuild -downloadPlatform iOS; then
              break
            fi
            echo "Download runtime fallito (tentativo $attempt), riprovo..."
            sleep 30
          done
          if ! xcrun simctl list runtimes | grep -q "iOS $SDK_VERSION"; then
            echo "::error::Runtime iOS $SDK_VERSION non disponibile per Xcode $(xcodebuild -version | head -n 1)"
            xcrun simctl list runtimes
            exit 1
          fi
          xcrun simctl list runtimes | grep "iOS $SDK_VERSION"

      - name: Installa dipendenze
        run: npm ci

      - name: Genera il progetto iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Installa CocoaPods
        working-directory: frontend/ios
        run: pod install --repo-update

      - name: Compila per iPhone e iPad Simulator
        working-directory: frontend/ios
        run: |
          set -uo pipefail
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' | head -n 1)
          test -n "$WORKSPACE"
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("workspace") or {}).get("schemes", [""])[0])')
          test -n "$SCHEME"
          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/atlas-ios-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ "$BUILD_STATUS" -ne 0 ]; then
            grep -E 'error:|BUILD FAILED|The following build commands failed' /tmp/atlas-ios-build.log | tail -20 || true
            ERROR_SUMMARY=$(grep -E 'error:|BUILD FAILED|The following build commands failed' /tmp/atlas-ios-build.log | tail -12 | tr '\n' ' ' | cut -c1-2500 || true)
            echo "::error::iOS build fallita (exit $BUILD_STATUS): ${ERROR_SUMMARY:-nessun errore estratto}"
            exit "$BUILD_STATUS"
          fi
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" ../ATLAS-AI-ios-simulator.zip

      - name: Carica log build iOS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-AI-ios-build-log
          path: /tmp/atlas-ios-build.log
          if-no-files-found: warn

      - name: Carica app iOS simulator
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-AI-ios-simulator
          path: frontend/ATLAS-AI-ios-simulator.zip
          if-no-files-found: error
